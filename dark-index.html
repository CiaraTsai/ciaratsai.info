<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ciara Tsai - Personal Website (Dark Theme)</title>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons via CDN for standard UI icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="assets/css/style.css?v=1.5">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>
  <!-- AntiGravity Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Dynamic Component Containers -->
  <div id="navbar-container"></div>

  <main>
    <div id="hero-container"></div>
    <div id="profile-container"></div>
    <div id="portfolio-container"></div>
    <div id="contact-container"></div>
  </main>

  <div id="footer-container"></div>

  <!-- Template Components (Script modules for modularity without fetch) -->
  <script src="assets/js/templates/layout.js"></script>
  <script src="assets/js/templates/hero.js"></script>
  <script src="assets/js/templates/profile.js"></script>
  <script src="assets/js/templates/portfolio.js"></script>
  <script src="assets/js/templates/contact.js"></script>

  <!-- Data and Logic -->
  <script src="assets/js/data.js?v=2.0"></script>
  <script src="assets/js/i18n.js?v=2.0"></script>
  <script src="assets/js/components.js?v=2.0"></script>
  <script src="assets/js/render.js?v=2.0"></script>
  <script src="assets/js/particles.js?v=2.0"></script>
  <script src="assets/js/text-effects.js?v=2.0"></script>
  <script src="assets/js/hero-video.js?v=2.0"></script>
  <script src="assets/js/main.js?v=2.0"></script>

  <!-- Helper Scripts (Exact copy of index.html) -->
  <script>
    function copyCrypto(element, address) {
      navigator.clipboard.writeText(address).then(() => {
        element.classList.add('copied');
        setTimeout(() => {
          element.classList.remove('copied');
        }, 2000);
      });
    }

    function copyContactText(element, text) {
      navigator.clipboard.writeText(text).then(() => {
        const textSpan = element.querySelector('.btn-text');
        const copiedText = element.getAttribute('data-copied-text') || 'Copied!';
        const originalText = textSpan ? textSpan.textContent : '';
        element.classList.add('copied');
        if (textSpan) textSpan.textContent = copiedText;
        setTimeout(() => {
          element.classList.remove('copied');
          if (textSpan) textSpan.textContent = originalText;
        }, 2000);
      });
    }
  </script>
</body>

</html>
