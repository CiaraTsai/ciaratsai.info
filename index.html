<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciara Tsai - Personal Website</title>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons via CDN for standard UI icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- AntiGravity Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Dynamic Component Containers -->
  <div id="navbar-container"></div>

  <main>
    <div id="hero-container"></div>
    <div id="profile-container"></div>
    <div id="portfolio-container"></div>
    <div id="contact-container"></div>
  </main>

  <div id="footer-container"></div>

  <!-- Web3Forms Captcha Script -->
  <script src="https://web3forms.com/client/script.js" async defer></script>

  <!-- Template Components (Script modules for modularity without fetch) -->
  <script src="assets/js/templates/layout.js"></script>
  <script src="assets/js/templates/hero.js"></script>
  <script src="assets/js/templates/profile.js"></script>
  <script src="assets/js/templates/portfolio.js"></script>
  <script src="assets/js/templates/contact.js"></script>

  <!-- Data and Logic -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/particles.js"></script>
  <script src="assets/js/text-effects.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function copyCrypto(element, address) {
      navigator.clipboard.writeText(address).then(() => {
        element.classList.add('copied');
        setTimeout(() => {
          element.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>

</html>
